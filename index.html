<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameHome</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="GameHome">
      </a>
      <ul class="nav-links">
        <li><a href="#">Product</a></li>
        <li><a href="#">Customer Service</a></li>
        <li><a href="#">Sign In</a></li>
        <li><a href="#">Cart</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-content">
        <div class="banner-slider">
  <button class="banner-arrow left" onclick="prevSlide()">&#10094;</button>

  <div class="banner-track">
    <div class="banner-slide active">
      <img src="gta.jpg" alt="Promotion banner 1">
    </div>

    <div class="banner-slide">
      <img src="re9.avif" alt="Promotion banner 2">
    </div>

    <div class="banner-slide">
      <img src="ark.jpg" alt="Promotion banner 3">
    </div>
  </div>

  <button class="banner-arrow right" onclick="nextSlide()">&#10095;</button>

          <div class="banner-dots">
            <button class="dot active" onclick="showSlide(0)"></button>
            <button class="dot" onclick="showSlide(1)"></button>
            <button class="dot" onclick="showSlide(2)"></button>
          </div>
        </div>
      </div>
    </section>

    <section class="platform-section" id="platforms">
      <div class="platform-wrapper">
        <a href="products.html?platform=ns" class="platform-card ns">
          <div class="platform-top">
            <div class="platform-label">Platform Collection</div>
            <h2>Nintendo Switch</h2>
            <p>
          
            </p>
          </div>
          <div class="platform-bottom">
            <div class="platform-icon">NS</div>
            <span class="platform-link">Shop Switch →</span>
          </div>
        </a>

        <a href="products.html?platform=ps" class="platform-card ps">
          <div class="platform-top">
            <div class="platform-label">Platform Collection</div>
            <h2>PlayStation</h2>
            <p>
            
            </p>
          </div>
          <div class="platform-bottom">
            <div class="platform-icon">PS</div>
            <span class="platform-link">Shop PlayStation →</span>
          </div>
        </a>
      </div>
    </section>

    
  </main>

  <footer>
    <p>© 2026 GameHub. Designed for a COMP 2680 project</p>
  </footer>
  <script>
    const slides = document.querySelectorAll('.banner-slide');
    const dots = document.querySelectorAll('.dot');
    let currentSlide = 0;
    let autoSlide;

    function showSlide(index) {
      if (index < 0) {
        currentSlide = slides.length - 1;
      } else if (index >= slides.length) {
        currentSlide = 0;
      } else {
        currentSlide = index;
      }

      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === currentSlide);
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlide);
      });
    }

    function nextSlide() {
      showSlide(currentSlide + 1);
      resetAutoSlide();
    }

    function prevSlide() {
      showSlide(currentSlide - 1);
      resetAutoSlide();
    }

    function startAutoSlide() {
      autoSlide = setInterval(() => {
        showSlide(currentSlide + 1);
      }, 3000);
    }

    function resetAutoSlide() {
      clearInterval(autoSlide);
      startAutoSlide();
    }

    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => {
        showSlide(index);
        resetAutoSlide();
      });
    });

    showSlide(0);
    startAutoSlide();
  </script>
</body>
</html>
